version: '3.8'

services:
  weidian-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: weidian-api
    ports:
      - "37071:37071"
    environment:
      - PORT=37071
      - GIN_MODE=release
    volumes:
      - ../configs:/app/configs
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["./bin/weidian-api"]
    networks:
      - senior-buyer-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:37071/weidian/api/timestamp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  youzan-api:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    container_name: youzan-api
    ports:
      - "37072:37072"
    environment:
      - PORT=37072
      - GIN_MODE=release
    volumes:
      - ../configs:/app/configs
      - ./logs:/app/logs
    restart: unless-stopped
    command: ["./bin/youzan-api"]
    networks:
      - senior-buyer-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:37072/youzan/api/timestamp"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  senior-buyer-network:
    driver: bridge
