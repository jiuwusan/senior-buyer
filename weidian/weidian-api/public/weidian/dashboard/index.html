<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>微店抢购配置编辑器</title>
    <link rel="stylesheet" href="./css/index.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>微店抢购配置编辑器</h1>
        <div class="actions">
          <button class="btn btn-secondary" onclick="openApiModal()">接口调用</button>
          <button class="btn btn-secondary" onclick="loadConfig()">刷新配置</button>
          <button class="btn btn-primary" onclick="saveConfig()">保存配置</button>
        </div>
      </div>

      <div id="tasksContainer" class="tasks">
        <div class="loading">加载中...</div>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div id="apiModal" class="modal-overlay" onclick="handleModalOverlayClick(event)">
      <div class="modal-card">
        <div class="modal-header">
          <div>
            <h2>接口调用</h2>
            <p>支持所有微店接口调用，GET 请求会自动追加时间戳避免缓存。</p>
          </div>
          <button class="btn btn-secondary btn-sm" onclick="closeApiModal()">关闭</button>
        </div>

        <div class="api-debugger">
          <div class="api-sidebar">
            <div class="form-group">
              <label>接口选择</label>
              <select id="apiSelect" onchange="handleApiSelectionChange(this.value)"></select>
            </div>
            <div id="apiList" class="api-list"></div>
          </div>

          <div class="api-main">
            <div class="api-meta">
              <span id="apiMethod" class="api-method"></span>
              <code id="apiPath" class="api-path"></code>
            </div>
            <p id="apiDescription" class="api-description"></p>

            <div class="form-group">
              <label id="apiParamsLabel">请求参数 (JSON)</label>
              <textarea id="apiParamsInput" rows="12" spellcheck="false"></textarea>
            </div>

            <div class="api-actions">
              <button class="btn btn-secondary btn-sm" onclick="fillApiDefaultParams()">重置默认参数</button>
              <button class="btn btn-primary" onclick="invokeSelectedApi()">调用接口</button>
            </div>

            <div class="form-group">
              <label>实际请求地址</label>
              <input id="apiRequestUrl" type="text" readonly />
            </div>

            <div class="form-group">
              <label>调用结果</label>
              <pre id="apiResult" class="api-result">请选择接口并发起调用</pre>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/index.js"></script>
  </body>
</html>
